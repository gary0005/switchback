---
# Every node runs the same play, because every node runs the same thing:
# angie on 443 in front of xray on unix sockets. What a node does is decided
# by the chains that name it, which is data in the inventory — so there is no
# ordering between nodes to get right, and any host can be run with --limit
# in isolation.
#
# Unmanaged nodes are excluded by group membership rather than by remembering
# to pass --limit: they carry live traffic under someone else's configuration.
#
# Tags. Every role can be run or skipped by its own name, and three purpose
# tags are complete on their own:
#
#   --tags users   refresh what depends on the user roster: xray rebuilds its
#                  inbound client lists, subscription re-renders the links.
#                  Use it after editing vpn_users or bumping a `rot`.
#   --tags certs   request or renew certificates only.
#   --tags verify  check the node without changing it.
#
# Roles are imported as tasks rather than listed in a `roles:` section so the
# tags above can be attached; mixing both sections is what makes execution
# order non-obvious.

- name: Configure the nodes
  hosts: vpn:!unmanaged
  become: true
  tasks:
    - name: Apply base system configuration
      ansible.builtin.import_role:
        name: common
      tags: [common]

    # Before angie, which will not start without the certificate. dns-01 does
    # not need angie running, so there is no ordering problem to work around.
    - name: Issue TLS certificates
      ansible.builtin.import_role:
        name: acme
      tags: [acme, certs]

    - name: Publish the static site
      ansible.builtin.import_role:
        name: website
      tags: [website]

    # Before angie: angie proxies to the sockets xray creates, and starting
    # in the other order leaves every location returning 502 until the next
    # run.
    - name: Configure xray
      ansible.builtin.import_role:
        name: xray
      tags: [xray, users]

    - name: Configure angie
      ansible.builtin.import_role:
        name: angie
      tags: [angie]

    - name: Publish subscriptions
      ansible.builtin.import_role:
        name: subscription
      tags: [subscription, users]

    - name: Configure the firewall
      ansible.builtin.import_role:
        name: firewall
      tags: [firewall]

# A separate play so the handlers of the one above have already run. Within a
# play, handlers fire at the end — checking before that would test the
# configuration the node had when the run started, which is exactly the case
# where a check passing means nothing.
#
# It also means every node has been configured before any chain is dialled,
# so a two-hop check is not racing the far end's first deployment.
- name: Check the nodes
  hosts: vpn:!unmanaged
  become: true
  tags: [verify]
  tasks:
    - name: Assert the shape and dial the chains
      ansible.builtin.import_role:
        name: verify
