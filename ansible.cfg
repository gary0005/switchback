[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
# `stdout_callback = yaml` used to resolve to community.general.yaml, which
# was removed in community.general 12.0.0. The built-in default callback with
# result_format = yaml produces the same output.
stdout_callback      = default
result_format        = yaml
retry_files_enabled  = False
interpreter_python   = auto_silent
# Gitignored, and every ansible command fails if it is simply missing — the
# check happens before any work, so even --syntax-check needs the file to
# exist. It does not need to be *right*: nothing in linting or a syntax check
# decrypts the vault. CI writes a throwaway one for that reason.
vault_password_file = .vault_pass

# host_key_checking is deliberately NOT disabled. Turning it off would accept
# any key presented on the first connection — an on-path attacker between you
# and a node would get a root shell on the box this repository exists to keep
# private. Seed known_hosts instead, verifying the fingerprint out of band:
#
#   ssh-keyscan -H 203.0.113.10 >> ~/.ssh/known_hosts

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s
