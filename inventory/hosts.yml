---
# The only place where the "physical" facts about the deployment live.
# Changing provider or domain means editing this file; roles stay untouched.
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3

  children:

    # Offshore nodes. Membership in this group means "may talk to xray directly".
    eu:
      children:

        edge:
          hosts:
            edge1:
              ansible_host: 203.0.113.10
              public_domain: e1.example.com
            # edge2:
            #   ansible_host: 203.0.113.11
            #   public_domain: e2.example.com

        exit:
          hosts:
            exit1:
              ansible_host: 203.0.113.20
              # No domain needed: only reality on a random port is exposed.

    # Domestic entry node — ingress for the 3-hop chain.
    # Deliberately NOT part of eu, so it never lands in the firewall peer set.
    ru:
      hosts:
        ru1:
          ansible_host: 198.51.100.5
          public_domain: r1.example.com
