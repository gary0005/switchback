---
# Group and host membership only. Per CoP inventory practice, no variable
# definitions live here: connection settings are in group_vars/all/ansible.yml
# and per-node facts are in host_vars/<host>/main.yml.
#
# Changing provider or domain means editing host_vars; roles stay untouched.
all:
  children:

    # Offshore nodes. Membership in this group means "may talk to xray directly".
    eu:
      children:

        edge:
          hosts:
            edge1:
            # edge2:

        exit:
          hosts:
            exit1:

    # Domestic entry node — ingress for the 3-hop chain.
    # Deliberately NOT part of eu, so it never lands in the firewall peer set.
    ru:
      hosts:
        ru1:
