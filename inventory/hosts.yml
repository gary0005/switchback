---
# Group and host membership only. Per CoP inventory practice, no variable
# definitions live here: connection settings are in group_vars/all/ansible.yml
# and per-node facts are in host_vars/<host>/main.yml.
#
# Every node plays the same part — angie on 443 in front of xray on unix
# sockets. What differs between them is which chains they appear in, and that
# is data (`vpn_chains`), not group membership. Adding a node is one entry
# here, one host_vars file, and the chains you want it to carry.
all:
  children:

    vpn:
      hosts:
        v0:
        v1:
        v2:
        v3:

    # Nodes this repository must not configure: they already carry live user
    # traffic and are managed elsewhere. They are listed because their peers
    # read domains and chain paths for them out of the inventory — but every
    # play excludes them, so the exclusion is structural rather than a matter
    # of remembering to pass --limit.
    #
    # A chain touching an unmanaged node is "pending": its far end has no
    # inbound yet, so it is kept out of subscriptions and out of the live
    # checks until the node can be taken over. See `vpn_chains_ready`.
    unmanaged:
      hosts:
        v1:
