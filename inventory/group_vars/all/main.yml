---
# ---------------------------------------------------------------------------
# Topology
# ---------------------------------------------------------------------------
# The deployment is described by a list of chains, not by node classes. Every
# node runs the same software in the same shape; a chain says who takes the
# user's traffic (`via`) and who egresses to the internet (`exit`).
#
#   via != exit   two hops. The user's TLS terminates on `via`'s angie, which
#                 hands the stream to the local xray, which dials `exit` over
#                 the same VLESS+XHTTP/TLS/443 an ordinary client speaks — so
#                 the second leg is indistinguishable from the first on the
#                 wire. It arrives at `exit`'s angie, never at its xray.
#   via == exit   one hop, for testing. Same path shape, no second leg.
#
# Names are arbitrary but appear in subscription labels, so keep them terse.
# Adding a node: one entry in hosts.yml, one host_vars file, and the chains
# you want below. Nothing else in this repository needs to know about it.
vpn_chains:
  # Two hops out of the domestic node.
  - { name: v0-v1, via: v0, exit: v1 }
  - { name: v0-v2, via: v0, exit: v2 }
  - { name: v0-v3, via: v0, exit: v3 }
  # Two hops between offshore nodes.
  - { name: v1-v2, via: v1, exit: v2 }
  - { name: v1-v3, via: v1, exit: v3 }
  - { name: v3-v1, via: v3, exit: v1 }
  - { name: v3-v2, via: v3, exit: v2 }
  # One hop. Test chains: they prove a node's ingress works on its own, and
  # they are the only thing that isolates "the hop is broken" from "the node
  # is broken". v0-solo egresses inside the restricted network and is a
  # reachability probe, not a usable route.
  - { name: v0-solo, via: v0, exit: v0 }
  - { name: v2-solo, via: v2, exit: v2 }
  - { name: v3-solo, via: v3, exit: v3 }

# Chains whose every end this repository actually configures. A chain that
# terminates on an unmanaged node has no inbound waiting for it, so publishing
# it would hand users a link that cannot work. Roles use this list; `vpn_chains`
# stays the full declaration so nothing is lost when the node is taken over.
vpn_chains_ready: >-
  {{ vpn_chains
     | rejectattr('via', 'in', groups['unmanaged'] | default([]))
     | rejectattr('exit', 'in', groups['unmanaged'] | default([]))
     | list }}

# ---------------------------------------------------------------------------
# Deterministic derivation
# ---------------------------------------------------------------------------
# Nothing is kept in state: paths, UUIDs and subscription tokens all derive
# from a single vault_seed, so the deployment is reproducible from this
# repository alone and any play can run under --limit in isolation.
# Rotation: bump a user's `rot` (targeted) or vault_seed (everything at once).
#
# Keyed by chain name rather than by host because both ends need the same
# values: `via` dials the path that `exit` is listening on. Deriving from the
# chain name means each side computes it locally — no cross-host facts, no
# play ordering. Defined here rather than in a role's defaults because role
# defaults are not in `hostvars` for a host belonging to another play.
vpn_chain_data: >-
  {%- set out = {} -%}
  {%- for c in vpn_chains -%}
  {%-   set base = vault_seed ~ ':chain:' ~ c.name -%}
  {%-   set _ = out.update({c.name: {
          'via': c.via,
          'exit': c.exit,
          'kind': 'test' if c.via == c.exit else 'multi',
          'path_in': '/' ~ ((base ~ ':in') | hash('sha256'))[:14],
          'path_transit': '/' ~ ((base ~ ':transit') | hash('sha256'))[:14],
          'transit_uuid': (base ~ ':transit') | to_uuid,
        }}) -%}
  {%- endfor -%}
  {{ out }}

# Secret prefix angie serves subscriptions under. Deployment-wide rather than
# per-node so one link keeps working whichever domain a user reaches.
vpn_sub_prefix: "/{{ ((vault_seed ~ ':subprefix') | hash('sha256'))[:12] }}"

# Credential the verify role dials chains with. A fixed identity rather than
# a borrowed user's: the checks then prove the route works without depending
# on who is currently on the roster, and revoking a user can never quietly
# disable the thing that would have caught the breakage.
vpn_probe_uuid: "{{ (vault_seed ~ ':probe') | to_uuid }}"

# Address the node is seen leaving from, which is what a chain check compares
# against. Defaults to the address Ansible reaches it on; override it in
# host_vars where a provider egresses from a different address than it
# accepts management traffic on.
vpn_egress_ip: "{{ ansible_host }}"

# Primary name of this node: the one it is addressed by in chains and in
# subscription links. The rest of `vpn_domains` are aliases served by the same
# angie and covered by the same certificate.
vpn_domain: "{{ vpn_domains[0] }}"

# Unix socket directory shared between the xray and angie roles. Pinned by
# RuntimeDirectory= in the xray systemd unit.
vpn_socket_dir: /run/xray

# ---------------------------------------------------------------------------
# Users
# ---------------------------------------------------------------------------
# Consumed by two roles: xray enforces the tiers in its inbound client lists,
# subscription renders the links. Tiers are enforced server side — a user
# without the `test` kind is absent from those inbounds' client lists, not
# merely missing the links from their subscription file.
#
# `name` is a label, not a person. It is used to tell users apart, to derive
# their UUID and subscription token, and to tag the client in xray's config —
# none of which needs anyone's actual name. Keep it functional, because the
# label is written in clear text to /usr/local/etc/xray/config.json on every
# node and appears in the output of a run: putting it in the vault would hide
# it from this repository and from nowhere else. Who is behind which label
# belongs wherever you keep the vault password and the subscription links.
#
# Choose a label once. It feeds the derivation, so renaming one reissues that
# user's UUID and link exactly as bumping `rot` does.
#
# rot — rotation counter: bump it to reissue this user's UUID and link.
vpn_users:
  - { name: ops, tier: all, rot: 1 }    # whoever debugs the deployment
  - { name: lead, tier: all, rot: 1 }   # test chains as well as the real ones

# Which chain kinds each tier may use. `test` chains are single-hop and exist
# to isolate faults, so they go to whoever debugs the deployment, not to users.
vpn_tier_kinds:
  main: [multi]
  all: [multi, test]

# ---------------------------------------------------------------------------
# Deployment settings
# ---------------------------------------------------------------------------
# These override role defaults. Each is declared, documented and validated in
# the owning role's defaults/main.yml and meta/argument_specs.yml — that file
# is the authoritative description of the role's interface, this one states
# what *this* deployment wants.

# Let's Encrypt sends expiry notices here. The address itself lives in the
# vault rather than in this file: it is personal data, this file is committed,
# and an address in a public-facing repository is an address that gets
# scraped. The role needs it under its own name, so this is the bridge.
acme_email: "{{ vault_acme_email }}"

firewall_ssh_allowed_cidrs: []     # e.g. ["203.0.113.0/24"]; empty = 22 open

# Language of the user-facing subscription page
# (roles/subscription/templates/index.<lang>.html.j2). Everything else in this
# repo is English; this is the one string set your end users actually read.
subscription_page_lang: en
