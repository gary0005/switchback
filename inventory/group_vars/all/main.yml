---
# ---------------------------------------------------------------------------
# Deterministic secret derivation
# ---------------------------------------------------------------------------
# Nothing is kept in state: paths, ports, UUIDs, keys and subscription tokens
# are all derived from a single vault_seed. The playbook is idempotent and
# fully reproducible from the repository alone.
# Rotation: bump a user's `rot` (targeted) or vault_seed (everything at once).
#
# Naming: `vpn_*` marks deployment-wide data shared by more than one role.
# Roles alias what they read for their own host into their own namespace
# (see each role's defaults/main.yml); what is read for *another* host through
# `hostvars[...]` is referenced by these names directly, because role defaults
# are only in scope for hosts of the running play and would come back
# undefined for a peer that belongs to a different play.

__host_seed: "{{ vault_seed }}:{{ inventory_hostname }}"

# --- XHTTP paths (one per chain) ------------------------------------------
# Bound by xray, proxied by angie, published by subscription.
vpn_path_hop1: "/{{ ((__host_seed ~ ':path:hop1') | hash('sha256'))[:14] }}"
vpn_path_hop2: "/{{ ((__host_seed ~ ':path:hop2') | hash('sha256'))[:14] }}"
vpn_path_hop3: "/{{ ((__host_seed ~ ':path:hop3') | hash('sha256'))[:14] }}"

# --- Secret prefix angie serves subscriptions under ------------------------
vpn_sub_prefix: "/{{ ((__host_seed ~ ':subprefix') | hash('sha256'))[:12] }}"

# --- Random port for the reality link between offshore nodes ---------------
# xray listens on it, firewall opens it to the peer set.
vpn_relay_port: >-
  {{ 20000 + ((((__host_seed ~ ':relayport') | hash('sha256'))[:6] | int(base=16)) % 40000) }}

# --- Reality: private key as hex, public key computed on the host ----------
# xray x25519 can derive the public key from the private one, so edge computes
# the exit node's key locally — no cross-host facts, no play ordering needed.
vpn_reality_priv_hex: "{{ (__host_seed ~ ':reality:priv') | hash('sha256') }}"
vpn_reality_short_id: "{{ ((__host_seed ~ ':reality:sid') | hash('sha256'))[:8] }}"

# --- Unix socket directory shared between the xray and angie roles ---------
# Pinned by RuntimeDirectory= in the xray systemd unit.
vpn_socket_dir: /run/xray

# ---------------------------------------------------------------------------
# Users
# ---------------------------------------------------------------------------
# Consumed by two roles: xray enforces the tiers in its inbound client lists,
# subscription renders the links. Tiers are enforced server side — a `main`
# user's UUID is absent from the 3-hop inbound, not merely missing from their
# subscription file.
#
# tier: main — main chain only (2 hops)
# tier: all  — all three chains
# rot        — rotation counter: bump it to reissue the UUID and the link
vpn_users:
  - { name: alice, tier: all, rot: 1 }
  - { name: bob, tier: main, rot: 1 }

# Which tiers may use which chain.
vpn_tier_hop1: [all]
vpn_tier_hop2: [all, main]
vpn_tier_hop3: [all]

# ---------------------------------------------------------------------------
# Deployment settings
# ---------------------------------------------------------------------------
# These override role defaults. Each is declared, documented and validated in
# the owning role's defaults/main.yml and meta/argument_specs.yml — that file
# is the authoritative description of the role's interface, this one states
# what *this* deployment wants.

# Let's Encrypt sends expiry notices here. There is no sane default; set it.
acme_email: "admin@example.com"

firewall_ssh_allowed_cidrs: []     # e.g. ["203.0.113.0/24"]; empty = 22 open

# Language of the user-facing subscription page
# (roles/subscription/templates/index.<lang>.html.j2). Everything else in this
# repo is English; this is the one string set your end users actually read.
subscription_page_lang: en
