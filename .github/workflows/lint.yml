---
name: lint

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install 'ansible-core>=2.16' ansible-lint yamllint

      # ansible.cfg points vault_password_file at .vault_pass, which is
      # gitignored — so it does not exist here, and every ansible command
      # fails on the missing file before it does any work. The contents do not
      # matter: linting and --syntax-check never decrypt the vault, they only
      # need the file to be present. A wrong password gets exactly as far.
      - name: Provide a throwaway vault password
        run: printf 'ci-does-not-decrypt-anything' > .vault_pass

      - name: yamllint
        run: yamllint --strict .

      - name: ansible-lint
        run: ansible-lint

      - name: Playbook syntax check
        run: ansible-playbook site.yml --syntax-check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The whole deployment derives from one vault_seed: a single plaintext
      # leak compromises every path, port, UUID and subscription token.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
