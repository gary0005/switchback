---
argument_specs:
  main:
    short_description: Apply a default-drop nftables ruleset.
    description:
      - >-
        Renders a ruleset whose open ports follow from the node's group
        membership. Ingress nodes get 80 and 443; peer-group members get the
        reality relay port opened to each other and to nobody else.
      - A node outside the peer group can never reach the relay port, which
        makes "domestic egress hits angie only" structural rather than a
        matter of operator discipline.
    options:
      firewall_packages:
        description: Packages providing nftables.
        type: list
        elements: str
        default:
          - nftables
      firewall_config_file:
        description: Path of the rendered ruleset.
        type: str
        default: /etc/nftables.conf
      firewall_ssh_allowed_cidrs:
        description:
          - Source ranges allowed to reach the SSH port. An empty list leaves
            it open to the world.
        type: list
        elements: str
        default: []
      firewall_ssh_port:
        description: TCP port SSH listens on.
        type: int
        default: 22
      firewall_ingress_tcp_ports:
        description: TCP ports opened on ingress nodes.
        type: list
        elements: int
        default: [80, 443]
      firewall_ingress_udp_ports:
        description: UDP ports opened on ingress nodes, for HTTP/3.
        type: list
        elements: int
        default: [443]
      firewall_peer_group:
        description:
          - Inventory group whose members may reach each other's relay port.
        type: str
        default: eu
      firewall_ingress_groups:
        description: Inventory groups whose members take user traffic on 80 and 443.
        type: list
        elements: str
        default:
          - edge
          - ru
      firewall_relay_port:
        description: Port the xray reality relay listens on.
        type: str
      firewall_required_facts:
        description:
          - Facts the role needs. Gathered with gather_subset=min when the
            play runs with gather_facts disabled.
        type: list
        elements: str
        default:
          - os_family
