---
argument_specs:
  main:
    short_description: Apply a default-drop nftables ruleset.
    description:
      - >-
        Renders a default-drop ruleset exposing SSH and the web ports, and
        nothing else. Every node gets the same one, because every node runs
        the same thing: angie on 443 in front of xray on unix sockets.
      - There is no port for xray, and no exception for peer nodes. A chain's
        second leg reaches the far node on 443 like any user's session, so
        "nothing talks to xray directly" holds by construction rather than by
        operator discipline.
    options:
      firewall_packages:
        description: Packages providing nftables.
        type: list
        elements: str
        default:
          - nftables
      firewall_config_file:
        description: Path of the rendered ruleset.
        type: str
        default: /etc/nftables.conf
      firewall_ssh_allowed_cidrs:
        description:
          - Source ranges allowed to reach the SSH port. An empty list leaves
            it open to the world.
        type: list
        elements: str
        default: []
      firewall_ssh_port:
        description: TCP port SSH listens on.
        type: int
        default: 22
      firewall_ingress_tcp_ports:
        description: TCP ports opened on every node.
        type: list
        elements: int
        default: [80, 443]
      firewall_ingress_udp_ports:
        description: UDP ports opened on every node, for HTTP/3.
        type: list
        elements: int
        default: [443]
      firewall_required_facts:
        description:
          - Facts the role needs. Gathered with gather_subset=min when the
            play runs with gather_facts disabled.
        type: list
        elements: str
        default:
          - os_family
