---
firewall_packages:
  - nftables

firewall_config_file: /etc/nftables.conf

# Empty list leaves port 22 open to the world; set it to lock SSH down,
# e.g. ["203.0.113.0/24"].
firewall_ssh_allowed_cidrs: []
firewall_ssh_port: 22

# User ingress: HTTP/2 over TCP and HTTP/3 over QUIC.
firewall_ingress_tcp_ports: [80, 443]
firewall_ingress_udp_ports: [443]

# --- Inventory coupling ----------------------------------------------------
# Group names are parameters rather than literals so the role can describe
# more than one topology per inventory.
#
# Only members of the peer group get the reality port opened, and only to
# each other. The domestic entry node is deliberately not in that group, so
# "domestic egress hits angie only" is structural rather than a matter of
# operator discipline.
firewall_peer_group: eu
firewall_ingress_groups:
  - edge
  - ru

# Deployment value this role reads for its own host: alias of the shared
# `vpn_relay_port`, which xray listens on.
firewall_relay_port: "{{ vpn_relay_port }}"

# Facts the role needs when the play runs with gather_facts: false.
firewall_required_facts:
  - os_family
