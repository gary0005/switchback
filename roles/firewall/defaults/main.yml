---
firewall_packages:
  - nftables

firewall_config_file: /etc/nftables.conf

# Empty list leaves port 22 open to the world; set it to lock SSH down,
# e.g. ["203.0.113.0/24"].
firewall_ssh_allowed_cidrs: []
firewall_ssh_port: 22

# User ingress: HTTP/2 over TCP and HTTP/3 over QUIC. This is the complete
# list of what any node exposes. There is no port for xray because xray binds
# unix sockets only, and the node-to-node leg of a chain arrives here on 443
# looking exactly like a user's session.
firewall_ingress_tcp_ports: [80, 443]
firewall_ingress_udp_ports: [443]

# Facts the role needs when the play runs with gather_facts: false.
firewall_required_facts:
  - os_family
