---
xray_version: "25.3.6"

# SHA256 of Xray-linux-64.zip for the pinned version, in `get_url` format,
# e.g. "sha256:9f86d081...". Empty means the download is NOT verified: the
# binary runs as root, so fill this in from the release's .dgst file.
xray_archive_checksum: ""

xray_download_url: >-
  https://github.com/XTLS/Xray-core/releases/download/v{{ xray_version }}/Xray-linux-64.zip

xray_packages:
  - unzip

xray_bin: /usr/local/bin/xray
xray_dir: /usr/local/etc/xray
xray_share_dir: /usr/local/share/xray

# LimitNOFILE= in the systemd unit. Each XHTTP stream costs descriptors.
xray_service_limit_nofile: 1000000

# Root-owned staging area for the release archive. Deliberately not under
# /tmp: that is world-writable, and everything here is unpacked as root.
xray_stage_dir: /var/cache/xray-install

# --- Inventory coupling ----------------------------------------------------
# Group names are parameters rather than literals so the role can describe
# more than one topology per inventory.
xray_peer_group: eu        # offshore nodes that may reach each other directly
xray_exit_group: exit      # nodes that egress to the internet
xray_entry_group: ru       # domestic ingress nodes
xray_edge_group: edge      # nodes terminating user TLS

# Which config template a node gets. Derived from group membership by default,
# so it never has to be set by hand. One of: exit, edge, ru.
xray_node_role: >-
  {{ 'exit' if inventory_hostname in groups[xray_exit_group] | default([])
     else ('ru' if inventory_hostname in groups[xray_entry_group] | default([])
           else 'edge') }}

# --- Deployment values this role reads for its own host --------------------
# Aliases of the shared `vpn_*` inventory variables. Values read for *other*
# hosts through hostvars keep the `vpn_*` name in the templates, because role
# defaults are not in scope for a peer belonging to a different play.
xray_socket_dir: "{{ vpn_socket_dir }}"
xray_path_hop1: "{{ vpn_path_hop1 }}"
xray_path_hop2: "{{ vpn_path_hop2 }}"
xray_path_hop3: "{{ vpn_path_hop3 }}"
xray_relay_port: "{{ vpn_relay_port }}"

# --- Users and tier policy -------------------------------------------------
# Tiers are enforced here, in the inbound client lists — not merely by
# omitting configs from a subscription file.
xray_users: "{{ vpn_users }}"
xray_tier_hop1: "{{ vpn_tier_hop1 }}"
xray_tier_hop2: "{{ vpn_tier_hop2 }}"
xray_tier_hop3: "{{ vpn_tier_hop3 }}"

# --- Reality ---------------------------------------------------------------
xray_reality_dest: "www.microsoft.com:443"
xray_reality_server_names:
  - www.microsoft.com
xray_reality_short_id: "{{ vpn_reality_short_id }}"

# --- Service account UUIDs -------------------------------------------------
# Derived from the seed, same as everything else. Used only for the current
# host, so unlike the per-peer material these can live in role defaults.
xray_node_link_uuid: "{{ (vault_seed ~ ':node:ru-to-edge') | to_uuid }}"
xray_relay_uuid: "{{ (vault_seed ~ ':node:edge-to-exit') | to_uuid }}"

# Facts the role needs when the play runs with gather_facts: false.
xray_required_facts:
  - os_family
