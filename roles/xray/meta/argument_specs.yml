---
argument_specs:
  main:
    short_description: Install and configure Xray-core.
    description:
      - >-
        Installs a pinned Xray-core release and renders the routing
        configuration implied by the chains that name this node. Nodes have no
        classes: a node fronts the chains it is the C(via) of and terminates
        the chains it is the C(exit) of, and a node can do both.
      - Every inbound is a unix socket. The role never binds a network port,
        because angie owns 443 and a chain's second leg arrives there as
        ordinary HTTPS.
      - Tiers are enforced here, in the inbound client lists. A user whose
        tier excludes a kind of chain has no UUID in that inbound at all,
        rather than merely lacking the config in their subscription file.
    options:
      xray_version:
        description: Xray-core release to install.
        type: str
        default: "26.3.27"
      xray_archive_checksum:
        description:
          - SHA256 of Xray-linux-64.zip in get_url format, for example
            "sha256:9f86d081...". Empty means the download is not verified,
            and the binary runs as root. Taken from the release's .dgst file;
            update it whenever xray_version moves.
        type: str
      xray_download_url:
        description: Where the release archive is fetched from.
        type: str
      xray_packages:
        description: Packages needed to unpack the release.
        type: list
        elements: str
        default:
          - unzip
      xray_bin:
        description: Path the xray binary is installed to.
        type: str
        default: /usr/local/bin/xray
      xray_dir:
        description: Directory holding config.json.
        type: str
        default: /usr/local/etc/xray
      xray_share_dir:
        description: Directory holding geoip.dat and geosite.dat.
        type: str
        default: /usr/local/share/xray
      xray_stage_dir:
        description:
          - Root-owned staging area for the release archive. Deliberately not
            under /tmp, which is world-writable, since it is unpacked as root.
        type: str
        default: /var/cache/xray-install
      xray_service_limit_nofile:
        description: LimitNOFILE for the systemd unit.
        type: int
        default: 1000000
      xray_socket_dir:
        description: Unix socket directory shared with angie.
        type: str
      xray_chains:
        description:
          - Chain declaration. Each entry needs a name, the node fronting it
            (via) and the node egressing on it (exit); via equal to exit is a
            single-hop test chain.
        type: list
        elements: dict
        options:
          name:
            description: Chain name. Appears in tags, socket names and labels.
            type: str
            required: true
          via:
            description: Inventory hostname terminating the user's TLS.
            type: str
            required: true
          exit:
            description: Inventory hostname egressing to the internet.
            type: str
            required: true
          blocked:
            description:
              - Set when something outside this deployment drops the route
                between the two nodes. The chain is still configured here, so
                it works the moment that changes; it is only kept out of
                subscriptions and out of the checks' failure condition.
            type: bool
            default: false
      xray_chain_data:
        description:
          - Per-chain derived values keyed by chain name, each carrying kind,
            path_in, path_transit and transit_uuid. Computed in the inventory
            so both ends of a chain derive the same values independently.
        type: dict
      xray_users:
        description:
          - User roster. Each entry needs name, tier and rot.
        type: list
        elements: dict
        options:
          name:
            description: User name, also used as the xray client email.
            type: str
            required: true
          tier:
            description: Tier deciding which kinds of chain the user may use.
            type: str
            required: true
          rot:
            description: Rotation counter; bump it to reissue the UUID.
            type: int
            required: true
      xray_tier_kinds:
        description:
          - Maps a tier name to the chain kinds it may use, for example
            {main - [multi], all - [multi, test]}.
        type: dict
      xray_probe_uuid:
        description:
          - Credential the verify role dials chains with, added to every
            user-facing inbound so the checks exercise the same inbound users
            do rather than a parallel one that could drift out of step.
        type: str
      xray_freedom_domain_strategy:
        description: domainStrategy of the freedom outbound used for egress.
        type: str
        default: UseIPv4
        choices:
          - AsIs
          - UseIP
          - UseIPv4
          - UseIPv6
      xray_transit_alpn:
        description: ALPN offered on the node-to-node leg.
        type: list
        elements: str
        default:
          - h2
      xray_transit_fingerprint:
        description: uTLS fingerprint presented on the node-to-node leg.
        type: str
        default: chrome
      xray_required_facts:
        description:
          - Facts the role needs. Gathered with gather_subset=min when the
            play runs with gather_facts disabled.
        type: list
        elements: str
        default:
          - os_family
