---
argument_specs:
  main:
    short_description: Install and configure Xray-core.
    description:
      - Installs a pinned Xray-core release, derives the Reality keypair for
        every offshore peer from the deployment seed, and renders the routing
        configuration matching the node's part in the topology.
      - Tiers are enforced here, in the inbound client lists. A user whose
        tier excludes a chain has no UUID in that inbound at all, rather than
        merely lacking the config in their subscription file.
    options:
      xray_version:
        description: Xray-core release to install.
        type: str
        default: "25.3.6"
      xray_archive_checksum:
        description:
          - SHA256 of Xray-linux-64.zip in get_url format, for example
            "sha256:9f86d081...". Empty means the download is not verified,
            and the binary runs as root, so filling this in is strongly
            recommended.
        type: str
        default: ""
      xray_download_url:
        description: Where the release archive is fetched from.
        type: str
      xray_packages:
        description: Packages needed to unpack the release.
        type: list
        elements: str
        default:
          - unzip
      xray_bin:
        description: Path the xray binary is installed to.
        type: str
        default: /usr/local/bin/xray
      xray_dir:
        description: Directory holding config.json.
        type: str
        default: /usr/local/etc/xray
      xray_share_dir:
        description: Directory holding geoip.dat and geosite.dat.
        type: str
        default: /usr/local/share/xray
      xray_stage_dir:
        description:
          - Root-owned staging area for the release archive. Deliberately not
            under /tmp, which is world-writable, since it is unpacked as root.
        type: str
        default: /var/cache/xray-install
      xray_service_limit_nofile:
        description: LimitNOFILE for the systemd unit.
        type: int
        default: 1000000
      xray_node_role:
        description:
          - Which config template the node gets. Derived from group
            membership by default, so it rarely needs setting by hand.
        type: str
        choices:
          - exit
          - edge
          - ru
      xray_peer_group:
        description: Inventory group of offshore nodes that may reach each other directly.
        type: str
        default: eu
      xray_exit_group:
        description: Inventory group of nodes that egress to the internet.
        type: str
        default: exit
      xray_entry_group:
        description: Inventory group of domestic ingress nodes.
        type: str
        default: ru
      xray_edge_group:
        description: Inventory group of nodes terminating user TLS.
        type: str
        default: edge
      xray_socket_dir:
        description: Unix socket directory shared with angie.
        type: str
      xray_path_hop1:
        description: XHTTP path of the 1-hop inbound on this node.
        type: str
      xray_path_hop2:
        description: XHTTP path of the 2-hop inbound on this node.
        type: str
      xray_path_hop3:
        description: XHTTP path of the 3-hop inbound on this node.
        type: str
      xray_relay_port:
        description: Port the reality relay inbound listens on.
        type: str
      xray_users:
        description:
          - User roster. Each entry needs name, tier and rot.
        type: list
        elements: dict
        options:
          name:
            description: User name, also used as the xray client email.
            type: str
            required: true
          tier:
            description: Tier deciding which chains the user may use.
            type: str
            required: true
          rot:
            description: Rotation counter; bump it to reissue the UUID.
            type: int
            required: true
      xray_tier_hop1:
        description: Tiers allowed on the 1-hop chain.
        type: list
        elements: str
      xray_tier_hop2:
        description: Tiers allowed on the 2-hop chain.
        type: list
        elements: str
      xray_tier_hop3:
        description: Tiers allowed on the 3-hop chain.
        type: list
        elements: str
      xray_reality_dest:
        description: Host Reality borrows its TLS handshake from.
        type: str
        default: "www.microsoft.com:443"
      xray_reality_server_names:
        description: SNI values accepted by the Reality inbound.
        type: list
        elements: str
      xray_reality_short_id:
        description: Reality short ID for this node.
        type: str
      xray_node_link_uuid:
        description: Service account UUID for the entry to edge link.
        type: str
      xray_relay_uuid:
        description: Service account UUID for the edge to exit reality link.
        type: str
      xray_required_facts:
        description:
          - Facts the role needs. Gathered with gather_subset=min when the
            play runs with gather_facts disabled.
        type: list
        elements: str
        default:
          - os_family
