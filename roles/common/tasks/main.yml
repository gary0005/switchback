---
- name: Ensure ansible_facts used by role
  ansible.builtin.setup:
    gather_subset: min
  when: not ansible_facts.keys() | list |
    intersect(common_required_facts) == common_required_facts

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# VLESS depends on the clock: more than a couple of minutes of
# drift breaks the handshake. This is the number one cause of
# "everything suddenly stopped working".
- name: Ensure time synchronisation is running
  ansible.builtin.service:
    name: "{{ common_time_sync_service }}"
    state: started
    enabled: true

- name: Tune sysctl for BBR and QUIC
  ansible.builtin.template:
    src: 99-vpn.conf.j2
    dest: "{{ common_sysctl_file }}"
    mode: "0644"
    backup: true
  notify: Reload sysctl

- name: Enable unattended upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    backup: true
