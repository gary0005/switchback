---
argument_specs:
  main:
    short_description: Baseline configuration applied to every node.
    description:
      - Installs the packages every node needs regardless of the part it
        plays, keeps the clock synchronised, and applies the sysctl tuning
        that BBR and QUIC depend on.
      - Packages needed by exactly one other role are installed by that role,
        so each role can be run on its own.
    options:
      common_base_packages:
        description: Packages installed on every node.
        type: list
        elements: str
        default:
          - ca-certificates
          - curl
          - chrony
          - python3
          - unattended-upgrades
      common_time_sync_service:
        description:
          - Service kept running to synchronise the clock. VLESS
            both break on more than a couple of minutes of drift.
        type: str
        default: chrony
      common_congestion_control:
        description: TCP congestion control to configure.
        type: str
        default: bbr
      common_congestion_module:
        description:
          - Kernel module providing it. Loaded explicitly and pinned for the
            next boot - sysctl accepts an unavailable algorithm silently and
            then keeps using the previous one.
        type: str
        default: tcp_bbr
      common_modules_file:
        description: File listing modules to load at boot.
        type: str
        default: /etc/modules-load.d/switchback.conf
      common_qdisc:
        description: Default queueing discipline.
        type: str
        default: fq
      common_netdev_backlog:
        description: net.core.netdev_max_backlog.
        type: int
        default: 250000
      common_somaxconn:
        description: net.core.somaxconn.
        type: int
        default: 65535
      common_sysctl_file:
        description: Path of the sysctl drop-in this role renders.
        type: str
        default: /etc/sysctl.d/99-vpn.conf
      common_unattended_upgrades_enabled:
        description: Whether unattended security upgrades are turned on.
        type: bool
        default: true
      common_socket_buffer_max:
        description:
          - Value for net.core.rmem_max and net.core.wmem_max. QUIC pushes
            large UDP datagrams and degrades on the default buffers.
        type: int
        default: 134217728
      common_file_max:
        description: Value for fs.file-max.
        type: int
        default: 1000000
      common_required_facts:
        description:
          - Facts the role needs. Gathered with gather_subset=min when the
            play runs with gather_facts disabled.
        type: list
        elements: str
        default:
          - os_family
