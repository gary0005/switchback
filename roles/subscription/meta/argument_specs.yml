---
argument_specs:
  main:
    short_description: Render per-user subscription files.
    description:
      - Writes one base64 subscription payload and one HTML page per user,
        under a filename derived from the deployment seed.
      - >-
        Static files only. There is no backend — nothing to exploit, nothing
        to monitor, and every angie node serves the identical set.
      - The filename is the credential. Anyone holding the URL holds the
        access, which is why the links are not printed by default.
      - Only chains configured at both ends are published. A chain ending on
        an unmanaged node has nothing listening on the path it would dial, so
        including it would hand out a link that cannot work.
    options:
      subscription_root:
        description:
          - Directory the payloads are written to. Must match angie_sub_root.
        type: str
        default: /var/www/sub
      subscription_page_lang:
        description:
          - Language of the user-facing page. Selects
            templates/index.<lang>.html.j2, so adding a language means adding
            that template.
        type: str
        default: en
      subscription_update_interval:
        description: Refresh interval hint given to clients, in hours.
        type: int
        default: 12
      subscription_show_links:
        description:
          - Whether to print the subscription URLs during the run. A URL is a
            credential, so this is off by default; combine with -v when you
            do want them.
        type: bool
        default: false
      subscription_chains:
        description:
          - Chains to publish - normally vpn_chains_ready rather than the full
            declaration. Each is addressed at the node fronting it.
        type: list
        elements: dict
      subscription_chain_data:
        description:
          - Per-chain derived values keyed by chain name, carrying kind and
            the user-facing path. Computed in the inventory.
        type: dict
      subscription_alpns:
        description:
          - ALPNs each chain is published under, one link per ALPN.
        type: list
        elements: str
        default:
          - h2
          - h3
      subscription_domain:
        description:
          - Domain the subscription URL itself points at. Defaults to the
            shared apex rather than the node's own name - every node renders
            the identical set of files, so a link under the apex survives any
            one node being unreachable.
        type: str
      subscription_prefix:
        description: Secret path prefix angie serves the payloads under.
        type: str
      subscription_users:
        description: User roster. Each entry needs name, tier and rot.
        type: list
        elements: dict
        options:
          name:
            description: User name.
            type: str
            required: true
          tier:
            description: Tier deciding which kinds of chain the user may use.
            type: str
            required: true
          rot:
            description: Rotation counter; bump it to reissue the link.
            type: int
            required: true
      subscription_tier_kinds:
        description:
          - Maps a tier name to the chain kinds it may use. Must agree with
            the xray role, which enforces the same policy in its client lists.
        type: dict
