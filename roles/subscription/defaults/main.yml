---
# Subscriptions are static files. No backend: nothing to exploit, nothing to
# monitor, and every angie node serves the identical set.
subscription_root: /var/www/sub

# Languages the user-facing page offers (templates/index.<lang>.html.j2). All
# of them ship in the one file and the reader switches between them, so adding
# a language costs a few hundred bytes rather than a second file per user. The
# first entry is the fallback for a browser that asks for neither.
subscription_page_langs:
  - en

# Hint clients put in the Subscription-Userinfo flow, in hours.
subscription_update_interval: 12

# Printing a subscription URL prints a credential: the token *is* the
# user's access. Off by default; opt in with
# `-e subscription_show_links=true -v` when you actually need them.
subscription_show_links: false

# --- Topology --------------------------------------------------------------
# Only chains this repository configures at both ends. A chain whose far end
# is still unmanaged has nothing listening on the path it would dial, so
# publishing it would hand out a link that cannot work.
subscription_chains: "{{ vpn_chains_ready }}"
subscription_chain_data: "{{ vpn_chain_data }}"

# Each chain is published twice, once per ALPN, h2 first because h2 is the one
# to use. Measured from a consumer connection in Russia, h3 costs nothing on
# many parallel connections — a speedtest saturated the line either way — but
# collapses on a single sustained stream: one 300 MB download came in at 88
# Mbit over h2 and 20 over h3. Reports from a weaker link have it dropping the
# connection outright. UDP/443 looks to be throttled per flow rather than
# blocked, which is why a latency test says nothing and a route can pass every
# check and still disappoint.
#
# h3 stays published: the throttling belongs to the network the client sits on,
# not to this deployment, and a user elsewhere may well be better off on it.
# The user-facing page says which to reach for.
subscription_alpns:
  - h2
  - h3

# --- Deployment values this role reads for its own host --------------------
# Aliases of the shared `vpn_*` inventory variables. Values read for *other*
# hosts through hostvars keep the `vpn_*` name in the templates, because role
# defaults are not in scope for a peer belonging to a different play.
# The shared apex, not this node's own name: every node renders the identical
# set of files, so a link under the apex survives any one of them being
# unreachable — which a link naming a single node does not.
subscription_domain: "{{ vpn_apex }}"
subscription_prefix: "{{ vpn_sub_prefix }}"

# --- Users and tier policy -------------------------------------------------
subscription_users: "{{ vpn_users }}"
subscription_tier_kinds: "{{ vpn_tier_kinds }}"
