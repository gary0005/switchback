---
- name: Ensure ansible_facts used by role
  ansible.builtin.setup:
    gather_subset: min
  when: not ansible_facts.keys() | list |
    intersect(angie_required_facts) == angie_required_facts

# Into a dedicated keyring rather than /etc/apt/trusted.gpg.d: a key dropped
# there is trusted for every repository on the system, not just this one.
- name: Add Angie signing key
  ansible.builtin.get_url:
    url: "{{ angie_repo_key_url }}"
    dest: "{{ angie_repo_keyring }}"
    mode: "0644"
    checksum: "{{ angie_repo_key_checksum | default(omit, true) }}"

# A template rather than deb822_repository: that module needs python3-debian
# on the node, installing it needs apt to refresh, and apt cannot refresh
# while this file still points at a path that does not exist. The module
# cannot repair a repository whose brokenness prevents the module from being
# installed. Writing the file first breaks that circle.
- name: Write the Angie repository
  ansible.builtin.template:
    src: angie.sources.j2
    dest: "{{ angie_repo_file }}"
    owner: root
    group: root
    mode: "0644"
    backup: true

# update_cache here rather than on an earlier task: by this point the
# repository file is correct, so the refresh has something valid to read.
- name: Install Angie
  ansible.builtin.apt:
    name: angie
    state: present
    update_cache: true

- name: Deploy main config
  ansible.builtin.template:
    src: angie.conf.j2
    dest: "{{ angie_conf_dir }}/angie.conf"
    mode: "0644"
    backup: true
  notify: Reload angie

- name: Deploy site config
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ angie_conf_dir }}/http.d/vpn.conf"
    mode: "0644"
    backup: true
  notify: Reload angie

# A separate task rather than `validate:` — that parameter checks the
# temporary file, which angie.conf does not include yet, so it would
# always pass. Reads only, so it neither reports a change nor is skipped
# in check mode.
- name: Verify angie configuration
  ansible.builtin.command: angie -t
  changed_when: false
  check_mode: false

# Both roots are created here so `angie -t` and a reload never depend on the
# order roles ran in. What goes inside them is another role's business: the
# site comes from `website`, the payloads from `subscription`.
- name: Create web roots
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ angie_site_root }}"
    - "{{ angie_sub_root }}"

- name: Enable angie
  ansible.builtin.service:
    name: angie
    enabled: true
    state: started
