---
- name: Ensure ansible_facts used by role
  ansible.builtin.setup:
    gather_subset: min
  when: not ansible_facts.keys() | list |
    intersect(angie_required_facts) == angie_required_facts

# deb822_repository is implemented on top of the python3-debian library and
# refuses to run without it. Installed explicitly rather than through the
# module's own install_python_debian, which hides a package installation
# inside a task that reads as configuration — and only works when the remote
# interpreter is the system Python.
- name: Install what the repository tasks need
  ansible.builtin.apt:
    name: "{{ angie_repo_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# Into a dedicated keyring rather than /etc/apt/trusted.gpg.d: a key dropped
# there is trusted for every repository on the system, not just this one.
- name: Add Angie signing key
  ansible.builtin.get_url:
    url: "{{ angie_repo_key_url }}"
    dest: "{{ angie_repo_keyring }}"
    mode: "0644"
    checksum: "{{ angie_repo_key_checksum | default(omit, true) }}"

# deb822 rather than the one-line format: apt_repository is deprecated and
# goes away in ansible-core 2.25. signed_by scopes the key to this repository
# alone.
- name: Add Angie repository
  ansible.builtin.deb822_repository:
    name: angie
    types: [deb]
    uris: "{{ angie_repo_uri | trim }}"
    suites: ["{{ angie_repo_suite }}"]
    components: [main]
    signed_by: "{{ angie_repo_keyring }}"
    enabled: true
    state: present

# deb822_repository does not refresh the cache itself, hence update_cache here.
- name: Install Angie
  ansible.builtin.apt:
    name: angie
    state: present
    update_cache: true

- name: Deploy main config
  ansible.builtin.template:
    src: angie.conf.j2
    dest: "{{ angie_conf_dir }}/angie.conf"
    mode: "0644"
    backup: true
  notify: Reload angie

- name: Deploy site config
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ angie_conf_dir }}/http.d/vpn.conf"
    mode: "0644"
    backup: true
  notify: Reload angie

# A separate task rather than `validate:` — that parameter checks the
# temporary file, which angie.conf does not include yet, so it would
# always pass. Reads only, so it neither reports a change nor is skipped
# in check mode.
- name: Verify angie configuration
  ansible.builtin.command: angie -t
  changed_when: false
  check_mode: false

# Both roots are created here so `angie -t` and a reload never depend on the
# order roles ran in. What goes inside them is another role's business: the
# site comes from `website`, the payloads from `subscription`.
- name: Create web roots
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ angie_site_root }}"
    - "{{ angie_sub_root }}"

- name: Enable angie
  ansible.builtin.service:
    name: angie
    enabled: true
    state: started
