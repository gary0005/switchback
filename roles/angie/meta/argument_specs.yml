---
argument_specs:
  main:
    short_description: Install and configure Angie as the TLS front end.
    description:
      - Terminates user TLS on 443 over both TCP (h2) and QUIC (h3), proxies
        the XHTTP paths to xray over unix sockets, serves the subscription
        directory under a secret prefix, and answers everything else with the
        public site. Port 80 redirects and nothing more - challenges are
        answered in DNS.
      - One location per path this node serves - the user-facing path of every
        chain it fronts, and the transit path of every chain it terminates.
        Both look identical in the configuration, because a request arriving
        from a peer node must not be distinguishable from a user's.
      - Expects the acme role to have issued a certificate covering every one
        of the node's names, and the xray role to own the socket directory.
    options:
      angie_domains:
        description:
          - Every name this node answers to and the certificate covers. The
            first is its primary, the one chains and subscription links
            address it by; the rest are aliases such as a shared apex.
        type: list
        elements: str
        required: true
      angie_conf_dir:
        description: Angie configuration directory.
        type: str
        default: /etc/angie
      angie_cert_name:
        description:
          - Certificate lineage name, matching acme_cert_name. Keyed by
            inventory hostname so renaming a domain does not strand the old
            lineage.
        type: str
      angie_cert_dir:
        description: Directory holding fullchain.pem and privkey.pem.
        type: str
      angie_site_root:
        description:
          - Document root of the public site, matching website_root. A domain
            serving nothing at / fails the first active probe, so this is
            load-bearing rather than decoration.
        type: str
        default: /var/www/site
      angie_sub_root:
        description:
          - Directory the subscription role renders into. Must match
            subscription_root.
        type: str
        default: /var/www/sub
      angie_worker_connections:
        description: worker_connections in the events block.
        type: int
        default: 16384
      angie_keepalive_timeout:
        description: keepalive_timeout in seconds.
        type: int
        default: 65
      angie_upstream_keepalive:
        description: Idle upstream connections kept per xray socket.
        type: int
        default: 64
      angie_client_max_body_size:
        description:
          - client_max_body_size. XHTTP sends bodies of unknown length and
            the default 1M ceiling tears the upload stream, so 0 disables it.
        type: int
        default: 0
      angie_proxy_timeout:
        description: proxy_read_timeout and proxy_send_timeout for XHTTP locations.
        type: str
        default: 300s
      angie_access_log:
        description:
          - >-
            Whether to keep an access log. Off by default — a node should not
            retain a record of who passed through it and when.
        type: bool
        default: false
      angie_repo_packages:
        description:
          - Packages the repository tasks need. deb822_repository is built on
            python3-debian and fails without it.
        type: list
        elements: str
        default:
          - python3-debian
      angie_repo_key_url:
        description: Where the Angie signing key is fetched from.
        type: str
      angie_repo_keyring:
        description:
          - Keyring the signing key is written to. A dedicated keyring
            referenced with signed-by, rather than /etc/apt/trusted.gpg.d,
            which would trust the key for every repository on the system.
        type: str
        default: /usr/share/keyrings/angie-signing.gpg
      angie_repo_key_checksum:
        description:
          - SHA256 of the signing key in get_url format. Empty trusts the key
            on first use; set it to pin the repository.
        type: str
        default: ""
      angie_repo_base_url:
        description: Base URL of the Angie apt repository.
        type: str
      angie_repo_uri:
        description:
          - Repository URI. Angie publishes per distribution version with the
            codename as the suite, so this ends in the version - for example
            .../angie/ubuntu/26.04 paired with the suite `resolute`. Override
            both if your release is not published yet.
        type: str
      angie_repo_suite:
        description: Suite within that repository; the distribution codename.
        type: str
      angie_chains:
        description:
          - Chain declaration, as described by the xray role. angie serves a
            location for each chain naming this node as via or as exit.
        type: list
        elements: dict
      angie_socket_dir:
        description: Unix socket directory shared with xray.
        type: str
      angie_sub_prefix:
        description: Secret path prefix subscriptions are served under.
        type: str
      angie_chain_data:
        description:
          - Per-chain derived values keyed by chain name, carrying the paths
            angie proxies. Computed in the inventory.
        type: dict
      angie_required_facts:
        description:
          - Facts the role needs. Gathered with gather_subset=min when the
            play runs with gather_facts disabled.
        type: list
        elements: str
