---
# --- What the structural checks allow -------------------------------------
# The complete set of ports any node may expose. Anything else in the ruleset
# is a finding: the design has exactly one listener reachable from the
# network, and it is angie.
verify_expected_ports: [22, 80, 443]

# Processes allowed to hold a listening socket on a port outside the list
# above. These are system clients, not services: a DHCP client binds 68 but
# nothing can reach it, because the firewall drops inbound there and conntrack
# is what lets the lease renewal answer come back.
#
# xray is deliberately absent — every one of its inbounds is a unix socket, so
# a network listener owned by xray means the topology has grown a direct route
# that the censor can find and block. Process names come from `ss`, which
# truncates them to 15 characters.
verify_allowed_listeners:
  - systemd-network
  - systemd-resolve
  - chronyd
  - dhclient

# --- Live chain checks -----------------------------------------------------
# Dial each chain this node fronts the way a client does, and compare where
# the traffic came out against where it was supposed to. This is the only
# check that distinguishes "configured correctly" from "actually works".
verify_live: true

# Service echoing back the caller's address. Plain text, one address, no JSON
# to parse. Reached *through* the chain, so it also proves egress works.
verify_echo_url: https://api.ipify.org

# Loopback port the throwaway client listens on while a check runs.
verify_probe_port: 10808

# Root-owned scratch space for probe configs. Not /tmp: it is world-writable,
# and these files carry a working credential.
verify_probe_dir: /var/cache/xray-probe

# Seconds to wait for the throwaway client to come up, then for the request
# itself. A two-hop chain crosses two TLS handshakes before the first byte.
verify_probe_startup: 10
verify_probe_timeout: 25

# --- Credentials that must not be here -------------------------------------
# There is no DNS API credential in this deployment at all — the http-01
# challenge is distributed over ssh instead. This check is what keeps that
# true: a future change that reaches for dns-01 "because it is simpler" would
# put a zone-wide key on every node, and it would do it quietly.
verify_no_credential_paths:
  - /etc/letsencrypt
  - /etc/ssl/switchback
verify_no_credential_patterns:
  - "*.env"
  - "*dns*api*"
  - "*credentials*"

# --- DNS -------------------------------------------------------------------
# There is no Terraform holding the zone, so nothing else notices when the
# records and the inventory disagree. This check does, and it checks what
# clients actually resolve rather than what some state file claims. Every name
# a node answers to has to resolve to that node — among others is fine, since
# the apex is shared and dns-01 does not care which node a visitor reaches.
verify_domains: "{{ vpn_domains }}"
verify_node_address: "{{ ansible_host }}"

# --- Topology --------------------------------------------------------------
# Every chain configured at both ends, including ones known to be blocked:
# they are dialled and reported so the day a route comes back is visible,
# but they do not fail the run.
verify_chains: "{{ vpn_chains_checkable }}"
verify_blocked_chains: "{{ vpn_chains_blocked }}"
verify_chain_data: "{{ vpn_chain_data }}"

# --- Deployment values this role reads for its own host --------------------
verify_socket_dir: "{{ vpn_socket_dir }}"
verify_domain: "{{ vpn_domain }}"
verify_probe_uuid: "{{ vpn_probe_uuid }}"
verify_xray_bin: /usr/local/bin/xray

# Must agree with the xray role: the probe presents what the real second leg
# presents, or it is testing a different path than the one users take.
verify_transit_alpn:
  - h2
verify_transit_fingerprint: chrome
