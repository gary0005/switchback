---
# Everything needed for angie to start and to answer an http-01 challenge.
# Obtaining the certificate happens in issue.yml, which has to run *after*
# angie is up — see site.yml.
- name: Ensure ansible_facts used by role
  ansible.builtin.setup:
    gather_subset: min
  when: not ansible_facts.keys() | list |
    intersect(acme_required_facts) == acme_required_facts

- name: Install certbot
  ansible.builtin.apt:
    name: certbot
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the webroot and the certificate directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ acme_webroot }}"
    - "{{ acme_link_dir }}"
    - "{{ acme_link_dir }}/bootstrap"
    - "{{ acme_config_dir }}"
    - "{{ acme_config_dir }}/renewal-hooks/deploy"

# angie refuses to start without a certificate file, and certbot cannot get a
# real one until angie answers on port 80. This placeholder breaks that circle.
# It is replaced within the same run; nothing ever serves it to a user except
# in the seconds between angie starting and the challenge succeeding.
- name: Generate the placeholder certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -newkey
      - rsa:2048
      - -days
      - "{{ acme_bootstrap_days | int }}"
      - -keyout
      - "{{ acme_link_dir }}/bootstrap/privkey.pem"
      - -out
      - "{{ acme_link_dir }}/bootstrap/fullchain.pem"
      - -subj
      - "/CN={{ acme_domains[0] }}"
      - -addext
      - "subjectAltName={{ acme_domains | map('regex_replace', '^', 'DNS:') | join(',') }}"
    creates: "{{ acme_link_dir }}/bootstrap/fullchain.pem"

- name: Restrict the placeholder private key
  ansible.builtin.file:
    path: "{{ acme_link_dir }}/bootstrap/privkey.pem"
    owner: root
    group: root
    mode: "0600"

- name: Install the renewal deploy hook
  ansible.builtin.template:
    src: reload-service.sh.j2
    dest: "{{ acme_config_dir }}/renewal-hooks/deploy/reload-{{ acme_reload_service }}.sh"
    mode: "0755"
    backup: true

- name: Point angie at the real lineage if there is one, the placeholder if not
  ansible.builtin.include_tasks: link.yml
