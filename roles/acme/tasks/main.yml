---
- name: Ensure ansible_facts used by role
  ansible.builtin.setup:
    gather_subset: min
  when: not ansible_facts.keys() | list |
    intersect(acme_required_facts) == acme_required_facts

- name: Install certbot and the tools the hook needs
  ansible.builtin.apt:
    name: "{{ acme_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create certbot directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ acme_config_dir }}"
    - "{{ acme_config_dir }}/renewal-hooks/deploy"
    - "{{ acme_hook_dir }}"

- name: Write the DNS API credentials
  ansible.builtin.template:
    src: dns-api.env.j2
    dest: "{{ acme_dns_credentials }}"
    owner: root
    group: root
    mode: "0600"
    backup: true

- name: Install the dns-01 hook
  ansible.builtin.template:
    src: dns-hook.sh.j2
    dest: "{{ acme_hook_dir }}/dns-hook.sh"
    owner: root
    group: root
    mode: "0700"
    backup: true

- name: Install the renewal deploy hook
  ansible.builtin.template:
    src: reload-service.sh.j2
    dest: "{{ acme_config_dir }}/renewal-hooks/deploy/reload-{{ acme_reload_service }}.sh"
    mode: "0755"
    backup: true

# What makes this idempotent is comparing the names the lineage already
# covers, not the presence of a file. A `creates:` guard matches as soon as
# any certificate exists, so adding an alias to acme_domains would silently do
# nothing and angie would serve a certificate missing the new name.
# Reads only, so it neither reports a change nor is skipped in check mode.
- name: Read the names the current certificate covers
  ansible.builtin.command:
    argv:
      - certbot
      - certificates
      - --cert-name
      - "{{ acme_cert_name }}"
  register: __acme_existing
  changed_when: false
  failed_when: false
  check_mode: false

# The hooks are recorded in the lineage's renewal config, so `certbot renew`
# replays them unattended — the manual plugin renews itself only because they
# are there.
- name: Request or extend the certificate
  ansible.builtin.command:
    argv: "{{ __acme_argv }}"
  vars:
    __acme_covered: >-
      {{ (__acme_existing.stdout | default('')
          | regex_search('Domains:\s*(.+)', '\1')
          | default([], true) | join(' ')).split() }}
    __acme_argv: >-
      {%- set argv = [
            'certbot', 'certonly', '--non-interactive', '--agree-tos',
            '--expand', '--cert-name', acme_cert_name, '-m', acme_email,
            '--manual', '--preferred-challenges', 'dns',
            '--manual-auth-hook', acme_hook_dir ~ '/dns-hook.sh add',
            '--manual-cleanup-hook', acme_hook_dir ~ '/dns-hook.sh remove',
          ] -%}
      {%- for d in acme_domains -%}
      {%-   set _ = argv.extend(['-d', d]) -%}
      {%- endfor -%}
      {{ argv }}
  when: __acme_covered | symmetric_difference(acme_domains) | length > 0
  changed_when: true
  notify: Reload the service fronting the certificate
