---
# Everything needed before a certificate can be obtained: the webroot and a
# placeholder on the node, the hook and its target map on the controller.
# Issuing itself is in issue.yml, which has to run after angie is up — it is
# angie that answers the challenge. See site.yml.
- name: Check that certbot is installed on the controller
  ansible.builtin.command: certbot --version
  register: __acme_certbot
  changed_when: false
  failed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail with something actionable if it is not
  ansible.builtin.assert:
    that: __acme_certbot.rc == 0
    fail_msg: >-
      certbot is not installed on this machine, and certificates are issued
      here rather than on the nodes. Install it — `brew install certbot` on
      macOS, `apt install certbot` on Debian or Ubuntu — and run again.
    success_msg: "Controller has {{ __acme_certbot.stdout | default('certbot') | trim }}."
    quiet: true
  run_once: true

- name: Create the local certbot directory
  ansible.builtin.file:
    path: "{{ acme_local_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

# Built from the whole inventory rather than from the play: under --limit the
# play is one node, but a name shared by three still has to be answered on all
# three.
- name: Map every name to the nodes that answer for it
  ansible.builtin.template:
    src: targets.json.j2
    dest: "{{ acme_local_dir }}/targets.json"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true

- name: Install the http-01 hook
  ansible.builtin.template:
    src: http-hook.sh.j2
    dest: "{{ acme_local_dir }}/http-hook.sh"
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Create the challenge webroot and the certificate directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ acme_webroot }}"
    - "{{ acme_node_cert_dir }}"

# angie refuses to start without a certificate file, and http-01 is answered
# by angie — so something has to be in place before the real one can be
# obtained. Replaced within the same run, and never served to anyone except in
# the seconds between angie starting and the first issue succeeding.
- name: Generate a placeholder certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -newkey
      - rsa:2048
      - -days
      - "{{ acme_bootstrap_days | int }}"
      - -keyout
      - "{{ acme_node_cert_dir }}/privkey.pem"
      - -out
      - "{{ acme_node_cert_dir }}/fullchain.pem"
      - -subj
      - "/CN={{ acme_domains[0] }}"
      - -addext
      - "subjectAltName={{ acme_domains | map('regex_replace', '^', 'DNS:') | join(',') }}"
    creates: "{{ acme_node_cert_dir }}/fullchain.pem"

- name: Restrict the private key
  ansible.builtin.file:
    path: "{{ acme_node_cert_dir }}/privkey.pem"
    owner: root
    group: root
    mode: "0600"
