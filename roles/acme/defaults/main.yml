---
# Certificates are issued over dns-01, answered through the registrar's API by
# a hook this role installs. That buys two things http-01 cannot: a name may
# resolve to several nodes at once — the shared apex does — and a certificate
# is obtained before the domain takes any traffic, with port 80 needed only
# for the redirect.
#
# It costs one thing, and it is not small: every node holds a credential that
# can write to the zone. See the README.

# Every name the certificate covers — this node's primary plus its aliases.
acme_domains: "{{ vpn_domains }}"

# Lineage name, which is also the directory under live/. Keyed by inventory
# hostname rather than by the first domain: a renamed domain then updates the
# existing lineage instead of stranding it and starting a second one.
acme_cert_name: "{{ inventory_hostname }}"

# Email Let's Encrypt uses for expiry notices. There is no meaningful default,
# so it is declared here but left unset: set it in your inventory and let the
# role fail loudly rather than register a bogus address.
# acme_email: ""

acme_config_dir: /etc/letsencrypt

# certbot, plus dig — the hook waits for its own record to become visible
# rather than sleeping a fixed guess.
acme_packages:
  - certbot
  - bind9-dnsutils

# --- The zone and its API --------------------------------------------------
# Set these in the inventory from the vault; they have no safe defaults.
# acme_dns_zone: ""
# acme_dns_api_key: ""
# acme_dns_api_secret: ""

acme_dns_api_base: https://spaceship.dev/api/v1

# Where the hook and the credentials it reads are installed.
acme_hook_dir: /etc/letsencrypt/hooks
acme_dns_credentials: /etc/letsencrypt/dns-api.env

# TTL of the challenge record. Short: it exists for about a minute, and a long
# TTL only means a stale negative answer lingers in a resolver's cache.
acme_dns_ttl: 60

# How the hook waits for the record to be visible before letting certbot ask
# Let's Encrypt to look. Polling a public resolver rather than sleeping blind:
# it is both faster when propagation is quick and safer when it is not.
acme_dns_check_resolver: 1.1.1.1
acme_dns_check_tries: 30
acme_dns_check_interval: 5

# Service reloaded by the renewal deploy hook once a new certificate lands.
acme_reload_service: angie

# Facts the role needs when the play runs with gather_facts: false.
acme_required_facts:
  - os_family
