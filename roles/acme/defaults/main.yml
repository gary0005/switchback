---
# Certificates are issued on the controller, not on the nodes, and only the
# resulting files are shipped out. dns-01 needs a credential that can write to
# the zone, and that credential is account-wide at this registrar — so a node
# holding it would hand an intruder every domain in the account. Keeping it on
# one machine you control means a compromised node leaks its own certificate
# and nothing else.
#
# What it costs: renewal is not unattended. Nothing on a node will notice an
# expiring certificate, so the playbook has to be run — see the README.

# Every name the certificate covers — this node's primary plus its aliases.
acme_domains: "{{ vpn_domains }}"

# Lineage name, which is also the directory under live/. Keyed by inventory
# hostname rather than by the first domain: a renamed domain then updates the
# existing lineage instead of stranding it and starting a second one.
acme_cert_name: "{{ inventory_hostname }}"

# Email Let's Encrypt uses for expiry notices. There is no meaningful default,
# so it is declared here but left unset: set it in your inventory and let the
# role fail loudly rather than register a bogus address.
# acme_email: ""

# --- On the controller -----------------------------------------------------
# Everything certbot owns lives here: its config, the lineages, the hook and
# the credential. Deliberately outside the repository, so no `git add -A` can
# ever sweep a private key or an API key into a commit.
acme_local_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.local/share/switchback/acme"

# --- On the node -----------------------------------------------------------
# Where the two files are installed. Not /etc/letsencrypt: certbot is not
# installed here and nothing on the node renews anything, so borrowing its
# layout would only suggest otherwise.
acme_node_cert_dir: "/etc/ssl/switchback/{{ acme_cert_name }}"

# --- The zone and its API --------------------------------------------------
# Set these in the inventory from the vault; they have no safe defaults.
# acme_dns_zone: ""
# acme_dns_api_key: ""
# acme_dns_api_secret: ""

acme_dns_api_base: https://spaceship.dev/api/v1

# TTL of the challenge record. Short: it exists for about a minute, and a long
# TTL only means a stale negative answer lingers in a resolver's cache.
acme_dns_ttl: 60

# How the hook waits for the record to be visible before letting certbot ask
# Let's Encrypt to look. Polling a public resolver rather than sleeping blind:
# it is both faster when propagation is quick and safer when it is not.
acme_dns_check_resolver: 1.1.1.1
acme_dns_check_tries: 30
acme_dns_check_interval: 5

# Renew anything expiring within this many days. Let's Encrypt certificates
# last 90; certbot's own default is 30, and the margin matters more here
# because nothing renews unless somebody runs the playbook.
acme_renew_days: 45

# Service reloaded on the node when a new certificate lands.
acme_reload_service: angie
