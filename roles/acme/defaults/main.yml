---
# Certificates are issued over http-01: the node answers the challenge itself
# on port 80, so no DNS credential has to exist on it. A node that is broken
# into cannot then be used to take over the zone — which is the reason this
# deployment accepts http-01's constraint that a name must resolve to exactly
# one node. See the README.
acme_webroot: /var/www/acme

# Every name the certificate covers — this node's primary plus its aliases.
# All of them must resolve to this node, or the challenge is answered by
# whichever node the name points at instead.
acme_domains: "{{ vpn_domains }}"

# Lineage name, which is also the directory under live/. Keyed by inventory
# hostname rather than by the first domain: a renamed domain then updates the
# existing lineage instead of stranding it and starting a second one.
acme_cert_name: "{{ inventory_hostname }}"

# Email Let's Encrypt uses for expiry notices. There is no meaningful default,
# so it is declared here but left unset: set it in your inventory and let the
# role fail loudly rather than register a bogus address.
# acme_email: ""

acme_config_dir: /etc/letsencrypt

# --- Where angie looks for the certificate ---------------------------------
# angie is pointed at a symlink, never at a lineage directly. That breaks the
# deadlock http-01 creates: angie will not start without a certificate, and
# certbot cannot obtain one until angie is answering on port 80. The symlink
# starts out on a self-signed placeholder, angie comes up, the challenge is
# answered, and the symlink moves to the real lineage — all in one run, with
# no window where angie is down.
acme_link_dir: /etc/ssl/switchback
acme_bootstrap_days: 3650

# Service reloaded once the symlink moves and by the renewal deploy hook.
acme_reload_service: angie

# Facts the role needs when the play runs with gather_facts: false.
acme_required_facts:
  - os_family
