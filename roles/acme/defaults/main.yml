---
# Certificates are issued on the controller over http-01, and the challenge
# file is copied to every node that answers for the name being validated.
#
# That last part is what makes a shared apex work without a DNS credential.
# Let's Encrypt connects to one address out of the several a name resolves to
# and only moves to another if the connection itself fails — a node that
# answers without the file returns 404 and ends the validation. Putting the
# file on all of them removes the guess, which is exactly what Let's Encrypt's
# own documentation says to do when several servers share a name.
#
# No API key exists anywhere in this deployment as a result. What it costs:
# port 80 must stay open, and issuing depends on SSH reaching every node that
# carries the name.

# Every name the certificate covers — this node's primary plus its aliases.
acme_domains: "{{ vpn_domains }}"

# Lineage name, which is also the directory under live/. Keyed by inventory
# hostname rather than by the first domain: a renamed domain then updates the
# existing lineage instead of stranding it and starting a second one.
acme_cert_name: "{{ inventory_hostname }}"

# Email Let's Encrypt uses for expiry notices. There is no meaningful default,
# so it is declared here but left unset: set it in your inventory and let the
# role fail loudly rather than register a bogus address.
# acme_email: ""

# --- On the controller -----------------------------------------------------
# certbot's configuration, the lineages and the hook. Deliberately outside the
# repository, so no `git add -A` can ever sweep a private key into a commit.
acme_local_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.local/share/switchback/acme"

# Hosts the hook may distribute challenge files to. Built from the inventory,
# not from the play: with --limit the play is one node, but a name shared by
# three still has to be answered on all three.
acme_target_group: vpn
acme_target_exclude_group: unmanaged

# ssh options the hook uses. BatchMode so a missing key fails instead of
# hanging on a prompt inside certbot.
acme_ssh_options: "-o BatchMode=yes -o ConnectTimeout=10"

# --- On the node -----------------------------------------------------------
# Where the certificate is installed, and where challenge files are dropped.
acme_node_cert_dir: "/etc/ssl/switchback/{{ acme_cert_name }}"
acme_webroot: /var/www/acme

# Validity of the self-signed placeholder. angie will not start without a
# certificate and http-01 is answered by angie, so something has to be there
# first; it is replaced in the same run.
acme_bootstrap_days: 3650

# --- Renewal ---------------------------------------------------------------
# Renew anything expiring within this many days. Let's Encrypt certificates
# last 90; certbot's own default is 30, and the margin matters more here
# because nothing renews unless somebody runs the playbook.
acme_renew_days: 45

# Service reloaded on the node when a new certificate lands.
acme_reload_service: angie
