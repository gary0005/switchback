---
argument_specs:
  main:
    short_description: Issue a TLS certificate over http-01, on the controller.
    description:
      - Issues one certificate per node covering every name that node answers
        to, and installs the resulting files on it. certbot runs on the
        controller; the challenge is distributed to the nodes over ssh.
      - >-
        Distributing the challenge is what lets a name live on several nodes
        without any DNS credential existing. Let's Encrypt connects to one of
        the addresses a name resolves to and falls back to another only when
        the connection itself fails, so a node answering without the file ends
        the validation - putting the file on every node that carries the name
        removes the guess. It is what Let's Encrypt's own documentation
        recommends for names served by more than one machine.
      - >-
        What it costs - port 80 must stay open, issuing depends on ssh
        reaching every node carrying the name, and renewal is not unattended:
        nothing on a node notices an expiring certificate, so the playbook has
        to be run. See the role README.
      - Runs in two parts. main.yml prepares the webroot, a self-signed
        placeholder and the hook, because angie will not start without a
        certificate and http-01 is answered by angie. issue.yml runs after
        angie is up.
      - Idempotency comes from comparing the names the lineage already covers
        against acme_domains, so adding an alias reissues the certificate
        instead of silently leaving the old one in place.
    options:
      acme_email:
        description:
          - >-
            Address Let's Encrypt sends expiry notices to. Required, and
            deliberately given no default — a bogus address means nobody is
            told when renewal starts failing.
        type: str
        required: true
      acme_domains:
        description:
          - Every name the certificate covers, which is every name angie
            terminates TLS for on this node.
        type: list
        elements: str
        required: true
      acme_cert_name:
        description:
          - Lineage name, also the directory under live/. Keyed by inventory
            hostname rather than by the first domain, so renaming a domain
            updates the existing lineage instead of stranding it.
        type: str
      acme_webroot:
        description:
          - Directory challenge files are written to on the nodes and served
            from on port 80. Must match angie_acme_webroot.
        type: str
        default: /var/www/acme
      acme_target_group:
        description:
          - Inventory group the hook's target map is built from. Built from
            the inventory rather than the play, so --limit does not shrink the
            set of nodes a shared name is answered on.
        type: str
        default: vpn
      acme_target_exclude_group:
        description: Group excluded from that map.
        type: str
        default: unmanaged
      acme_ssh_options:
        description:
          - Options the hook passes to ssh. BatchMode so a missing key fails
            instead of hanging on a prompt inside certbot.
        type: str
      acme_bootstrap_days:
        description:
          - Validity of the self-signed placeholder that lets angie start
            before the first certificate exists.
        type: int
        default: 3650
      acme_local_dir:
        description:
          - Directory on the controller holding certbot's configuration, the
            lineages, the hook and the credential. Outside the repository on
            purpose, so no `git add -A` can sweep a private key into a commit.
        type: str
      acme_node_cert_dir:
        description:
          - Directory the certificate is installed into on the node. Must
            match angie_cert_dir.
        type: str
      acme_renew_days:
        description:
          - Renew anything expiring within this many days. Wider than
            certbot's own 30, because nothing renews unless the playbook is
            run - it has to survive the gap between two runs.
        type: int
        default: 45
      acme_reload_service:
        description:
          - Service reloaded on the node when a new or renewed certificate is
            installed.
        type: str
        default: angie
