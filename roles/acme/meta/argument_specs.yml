---
argument_specs:
  main:
    short_description: Issue a TLS certificate over http-01.
    description:
      - Installs certbot and issues one certificate covering every name the
        node answers to, over http-01.
      - http-01 rather than dns-01 so no DNS credential has to exist on the
        node - a node that is broken into cannot then be used to take over the
        zone. The cost is that every name must resolve to exactly one node,
        because the challenge is answered by whichever node the name points at.
      - Runs in two parts. main.yml installs certbot, opens the webroot and
        writes a self-signed placeholder, because angie will not start without
        a certificate and certbot cannot obtain one until angie answers on port
        80. issue.yml runs after angie is up, obtains the certificate and moves
        the symlink angie serves onto the new lineage.
      - Idempotency comes from comparing the names the lineage already covers
        against acme_domains, so adding an alias reissues the certificate
        instead of silently leaving the old one in place.
    options:
      acme_email:
        description:
          - >-
            Address Let's Encrypt sends expiry notices to. Required, and
            deliberately given no default — a bogus address means nobody is
            told when renewal starts failing.
        type: str
        required: true
      acme_domains:
        description:
          - Every name the certificate covers, which is every name angie
            terminates TLS for on this node.
        type: list
        elements: str
        required: true
      acme_cert_name:
        description:
          - Lineage name, also the directory under live/. Keyed by inventory
            hostname rather than by the first domain, so renaming a domain
            updates the existing lineage instead of stranding it.
        type: str
      acme_webroot:
        description:
          - Directory http-01 challenge files are written to and served from.
            Must match angie_acme_webroot.
        type: str
        default: /var/www/acme
      acme_link_dir:
        description:
          - Directory holding the placeholder certificate and the `current`
            symlink angie is pointed at. Must contain angie_cert_dir.
        type: str
        default: /etc/ssl/switchback
      acme_bootstrap_days:
        description: Validity of the self-signed placeholder, in days.
        type: int
        default: 3650
      acme_config_dir:
        description: certbot configuration directory.
        type: str
        default: /etc/letsencrypt
      acme_reload_service:
        description:
          - Service reloaded when the symlink moves, and by the renewal deploy
            hook once a new certificate lands.
        type: str
        default: angie
      acme_required_facts:
        description:
          - Facts the role needs. Gathered with gather_subset=min when the
            play runs with gather_facts disabled.
        type: list
        elements: str
        default:
          - os_family
