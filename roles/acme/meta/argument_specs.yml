---
argument_specs:
  main:
    short_description: Issue a TLS certificate over dns-01.
    description:
      - Installs certbot and issues one certificate covering every name the
        node answers to, answering the dns-01 challenge through the
        registrar's API with a hook this role installs.
      - >-
        dns-01 rather than http-01 because a name may then resolve to several
        nodes at once - the shared apex does - and because the certificate is
        obtained before the domain takes any traffic, with port 80 needed only
        for the redirect. The cost is that every node holds a credential able
        to write to the zone, which is the largest single risk in this
        deployment; see the role README.
      - The hook is a script in this repository rather than a third-party
        certbot plugin. It runs as root with that credential, so being able to
        read all of it matters more than the convenience.
      - Idempotency comes from comparing the names the lineage already covers
        against acme_domains, so adding an alias reissues the certificate
        instead of silently leaving the old one in place.
    options:
      acme_email:
        description:
          - >-
            Address Let's Encrypt sends expiry notices to. Required, and
            deliberately given no default — a bogus address means nobody is
            told when renewal starts failing.
        type: str
        required: true
      acme_domains:
        description:
          - Every name the certificate covers, which is every name angie
            terminates TLS for on this node.
        type: list
        elements: str
        required: true
      acme_cert_name:
        description:
          - Lineage name, also the directory under live/. Keyed by inventory
            hostname rather than by the first domain, so renaming a domain
            updates the existing lineage instead of stranding it.
        type: str
      acme_dns_zone:
        description:
          - The DNS zone challenge records are written into. Names are
            addressed relative to it, so it must be the registered domain
            rather than any subdomain.
        type: str
        required: true
      acme_dns_api_key:
        description: API key for the zone's provider.
        type: str
        required: true
      acme_dns_api_secret:
        description: API secret for the zone's provider.
        type: str
        required: true
      acme_dns_api_base:
        description: Base URL of the DNS provider's API.
        type: str
        default: https://spaceship.dev/api/v1
      acme_dns_credentials:
        description:
          - Path of the environment file the hook sources. Written 0600; it
            holds a credential that can rewrite the zone.
        type: str
        default: /etc/letsencrypt/dns-api.env
      acme_hook_dir:
        description: Directory the dns-01 hook is installed in.
        type: str
        default: /etc/letsencrypt/hooks
      acme_dns_ttl:
        description:
          - TTL of the challenge record. Short on purpose - it lives about a
            minute, and a long TTL only keeps a stale negative answer cached.
        type: int
        default: 60
      acme_dns_check_resolver:
        description:
          - Resolver the hook polls to confirm the record is visible before
            letting certbot ask Let's Encrypt to look.
        type: str
        default: 1.1.1.1
      acme_dns_check_tries:
        description: How many times the hook polls before giving up.
        type: int
        default: 30
      acme_dns_check_interval:
        description: Seconds between polls.
        type: int
        default: 5
      acme_packages:
        description:
          - certbot, plus the tools the hook needs. dig is not optional - the
            hook waits for its own record rather than sleeping a fixed guess.
        type: list
        elements: str
        default:
          - certbot
          - bind9-dnsutils
      acme_config_dir:
        description: certbot configuration directory.
        type: str
        default: /etc/letsencrypt
      acme_reload_service:
        description:
          - Service reloaded when a certificate is issued, and by the renewal
            deploy hook once a renewed one lands.
        type: str
        default: angie
      acme_required_facts:
        description:
          - Facts the role needs. Gathered with gather_subset=min when the
            play runs with gather_facts disabled.
        type: list
        elements: str
        default:
          - os_family
