---
argument_specs:
  main:
    short_description: Issue a TLS certificate over dns-01, on the controller.
    description:
      - Issues one certificate per node covering every name that node answers
        to, and installs the resulting files on it. certbot runs on the
        controller; the node never sees the DNS credential.
      - >-
        dns-01 rather than http-01 because a name may then resolve to several
        nodes at once - the shared apex does - and because the certificate is
        obtained before the domain takes any traffic. Issuing centrally rather
        than per node because the registrar's key is account-wide: a node
        holding it would expose every domain in the account. What it costs is
        unattended renewal - nothing on a node notices an expiring
        certificate, so the playbook has to be run. See the role README.
      - The hook is a script in this repository rather than a third-party
        certbot plugin. It handles a credential that can rewrite the zone, so
        being able to read all of it matters more than the convenience.
      - Idempotency comes from comparing the names the lineage already covers
        against acme_domains, so adding an alias reissues the certificate
        instead of silently leaving the old one in place.
    options:
      acme_email:
        description:
          - >-
            Address Let's Encrypt sends expiry notices to. Required, and
            deliberately given no default — a bogus address means nobody is
            told when renewal starts failing.
        type: str
        required: true
      acme_domains:
        description:
          - Every name the certificate covers, which is every name angie
            terminates TLS for on this node.
        type: list
        elements: str
        required: true
      acme_cert_name:
        description:
          - Lineage name, also the directory under live/. Keyed by inventory
            hostname rather than by the first domain, so renaming a domain
            updates the existing lineage instead of stranding it.
        type: str
      acme_dns_zone:
        description:
          - The DNS zone challenge records are written into. Names are
            addressed relative to it, so it must be the registered domain
            rather than any subdomain.
        type: str
        required: true
      acme_dns_api_key:
        description: API key for the zone's provider.
        type: str
        required: true
      acme_dns_api_secret:
        description: API secret for the zone's provider.
        type: str
        required: true
      acme_dns_api_base:
        description: Base URL of the DNS provider's API.
        type: str
        default: https://spaceship.dev/api/v1
      acme_local_dir:
        description:
          - Directory on the controller holding certbot's configuration, the
            lineages, the hook and the credential. Outside the repository on
            purpose, so no `git add -A` can sweep a private key into a commit.
        type: str
      acme_node_cert_dir:
        description:
          - Directory the certificate is installed into on the node. Must
            match angie_cert_dir.
        type: str
      acme_renew_days:
        description:
          - Renew anything expiring within this many days. Wider than
            certbot's own 30, because nothing renews unless the playbook is
            run - it has to survive the gap between two runs.
        type: int
        default: 45
      acme_dns_ttl:
        description:
          - TTL of the challenge record. Short on purpose - it lives about a
            minute, and a long TTL only keeps a stale negative answer cached.
        type: int
        default: 60
      acme_dns_check_resolver:
        description:
          - Resolver the hook polls to confirm the record is visible before
            letting certbot ask Let's Encrypt to look.
        type: str
        default: 1.1.1.1
      acme_dns_check_tries:
        description: How many times the hook polls before giving up.
        type: int
        default: 30
      acme_dns_check_interval:
        description: Seconds between polls.
        type: int
        default: 5
      acme_reload_service:
        description:
          - Service reloaded on the node when a new or renewed certificate is
            installed.
        type: str
        default: angie
